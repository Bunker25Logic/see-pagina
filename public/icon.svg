<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001733" />
      <stop offset="50%" stop-color="#002045" />
      <stop offset="100%" stop-color="#002b5c" />
    </linearGradient>

    <!-- Emerald Flame Gradient (Educação / Acre) -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00531b" />
      <stop offset="50%" stop-color="#008736" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Gold / Sun Flame Gradient (Estrela do Acre / Conhecimento) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe33c" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Bright White Gradient for open book pages -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />

  <!-- Center Group with Shadow -->
  <g filter="url(#glow)" transform="translate(0, -6)">
    
    <!-- LIVRO ABERTO (Base da Sabedoria e Educação) -->
    <!-- Página Esquerda -->
    <path d="M 256 372 C 215 352 145 352 92 376 C 84 380 76 374 76 365 L 76 215 C 76 208 81 202 88 199 C 142 176 215 178 256 204 Z" 
          fill="url(#pageGrad)" />
    
    <!-- Página Direita -->
    <path d="M 256 372 C 297 352 367 352 420 376 C 428 380 436 374 436 365 L 436 215 C 436 208 431 202 424 199 C 370 176 297 178 256 204 Z" 
          fill="url(#pageGrad)" />

    <!-- Dobra Central do Livro / Espinha -->
    <path d="M 254 204 L 254 374 L 258 374 L 258 204 Z" fill="#cbd5e1" opacity="0.8" />

    <!-- Linhas estilizadas de conteúdo do livro (Página Esquerda) -->
    <path d="M 124 246 Q 180 230 228 244" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 124 278 Q 180 262 228 276" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 124 310 Q 180 294 228 308" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Linhas estilizadas de conteúdo do livro (Página Direita) -->
    <path d="M 284 244 Q 332 230 388 246" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 284 276 Q 332 262 388 278" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 284 308 Q 332 294 388 310" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- TOCHA / CHAMA DA EDUCAÇÃO & BRASILÉIA FLORESTA (Verde e Luz) -->
    <!-- Chama Externa Esmeralda -->
    <path d="M 256 100 C 230 140 216 170 226 206 C 235 186 248 176 256 168 C 264 176 277 186 286 206 C 296 170 282 140 256 100 Z" 
          fill="url(#greenGrad)" />

    <!-- Chama Interna Dourada -->
    <path d="M 256 128 C 243 150 238 170 244 190 C 248 180 252 174 256 170 C 260 174 264 180 268 190 C 274 170 269 150 256 128 Z" 
          fill="url(#goldGrad)" />

    <!-- ESTRELA ALTANEIRA DO ACRE (Símbolo de Guia e Futuro) -->
    <g transform="translate(256, 82) scale(0.95)" filter="url(#starGlow)">
      <!-- Estrela de 5 pontas -->
      <polygon points="0,-24 7,-8 24,-7 11,5 15,22 0,12 -15,22 -11,5 -24,-7 -7,-8" 
               fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Badge estilizada "SEE" no rodapé do ícone -->
  <g transform="translate(256, 436)">
    <rect x="-84" y="-18" width="168" height="34" rx="17" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="3.5" fill="#ffffff" text-anchor="middle">EDUCA SEE</text>
  </g>
</svg>
